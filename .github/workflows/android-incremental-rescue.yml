name: Bounded final incremental rescue of original signed-in phone
on:
  workflow_dispatch:
    inputs:
      resume_release_id:
        type: string
        required: false
        description: Existing UNTRUSTED draft only; never mutate a published checkpoint
permissions:
  contents: write
concurrency:
  group: android-original-guest-rescue
  cancel-in-progress: false
jobs:
  reconcile-original-guest-state:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RESUME_RELEASE_ID: ${{ inputs.resume_release_id }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      GH_PAT: ${{ secrets.GH_PAT || github.token }}
      EMULATOR_STATE_KEY: ${{ secrets.EMULATOR_STATE_KEY }}
      EMULATOR_GATEWAY_URL: ${{ secrets.EMULATOR_GATEWAY_URL }}
      EMULATOR_GATEWAY_SECRET: ${{ secrets.EMULATOR_GATEWAY_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests cryptography
      - name: Untrusted live precopy, bounded frozen reconciliation, thaw, authenticated GitHub readback
        run: python -u android-emulator/incremental_guest_rescue.py
