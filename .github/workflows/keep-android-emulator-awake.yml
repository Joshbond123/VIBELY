name: Keep Android Emulator Awake

# The Blitz container sleeps after ~15 minutes without HTTP traffic, which dropped
# the reverse tunnel and left the phone offline (one cause of the black screen).
# This job used to spin a full Playwright/Chromium install every 10 minutes —
# ~8 runner-minutes of overhead per attempt. A plain keep-alive request is enough
# to keep the container hot, and it reports the phone's real state so a dead
# emulator is visible in the Actions history instead of being silently ignored.

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vibely-keep-awake
  cancel-in-progress: true

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      GATEWAY: ${{ vars.EMULATOR_GATEWAY_URL || 'https://android.aivideo.blitz.cloud' }}
      BLITZ_API_KEY: ${{ secrets.BLITZ_API_KEY }}
      BLITZ_ANDROID_APP: ${{ secrets.BLITZ_ANDROID_APP }}

    steps:
      - name: Keep-alive request + phone status
        id: keepalive
        run: |
          set -o pipefail
          HEALTH=$(curl -fsSL --max-time 20 "${GATEWAY}/api/public/health" 2>/dev/null || echo '')
          if [[ -z "$HEALTH" ]]; then
            echo "Gateway did not answer; attempting a Blitz resume."
            if [[ -n "${BLITZ_API_KEY}" && -n "${BLITZ_ANDROID_APP}" ]]; then
              python3 - <<'PY' || true
import json, os, urllib.request
key, app = os.environ["BLITZ_API_KEY"], os.environ["BLITZ_ANDROID_APP"]
hdrs = {"Authorization": f"Bearer {key}", "Content-Type": "application/json",
        "Accept": "application/json, text/event-stream"}
def call(method, params, rid):
    req = urllib.request.Request("https://mcp.blitz.cloud/mcp",
        data=json.dumps({"jsonrpc": "2.0", "id": rid, "method": method, "params": params}).encode(),
        headers=hdrs, method="POST")
    with urllib.request.urlopen(req, timeout=30) as r:
        return r.headers.get("mcp-session-id"), r.read().decode()
sid, out = call("initialize", {"protocolVersion": "2024-11-05", "capabilities": {}, "clientInfo": {"name": "keep-awake", "version": "1"}}, 1)
if sid: hdrs["Mcp-Session-Id"] = sid
sid, out = call("tools/call", {"name": "apps_resume", "arguments": {"app": app}}, 2)
print(out[:400])
PY
              sleep 20
              HEALTH=$(curl -fsSL --max-time 20 "${GATEWAY}/api/public/health" 2>/dev/null || echo '')
            fi
          fi

          if [[ -z "$HEALTH" ]]; then
            echo "::error::Gateway unreachable even after a resume attempt"
            exit 1
          fi
          echo "$HEALTH" | jq .
          CONNECTED=$(echo "$HEALTH" | jq -r '.active_emulator_connected // false')
          STANDBY=$(echo "$HEALTH" | jq -r '.standby_count // 0')
          RSS=$(echo "$HEALTH" | jq -r '.rss_mb // 0')
          echo "connected=${CONNECTED} standby=${STANDBY} gateway_rss_mb=${RSS}"
          {
            echo "### Android phone keep-alive"
            echo "- gateway reachable: yes"
            echo "- active phone: ${CONNECTED}"
            echo "- standby candidates: ${STANDBY}"
            echo "- gateway RSS: ${RSS} MB"
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$CONNECTED" != "true" ]]; then
            # Not fatal: the scheduled rotation / self-healing agent is responsible
            # for recovery. Surfacing it keeps the failure visible in history.
            echo "::warning::No active Android phone right now (standby=${STANDBY}); self-healing rotation will restore it."
          fi
