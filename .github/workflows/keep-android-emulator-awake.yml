name: Keep Android Emulator Awake (Playwright Stealth)

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright + Stealth
        run: |
          npm init -y
          npm install playwright playwright-extra puppeteer-extra-plugin-stealth
          npx playwright install chromium --with-deps

      - name: Wake attempt (stealth browser)
        id: wake
        run: |
          node << 'EOF'
          const { chromium } = require('playwright-extra');
          const stealth = require('puppeteer-extra-plugin-stealth')();
          chromium.use(stealth);

          (async () => {
            const browser = await chromium.launch({
              headless: true,
              args: [
                '--disable-blink-features=AutomationControlled',
                '--disable-features=IsolateOrigins,site-per-process',
                '--no-sandbox',
                '--disable-setuid-sandbox',
                '--disable-infobars',
                '--window-size=1920,1080',
                '--start-maximized',
                '--disable-dev-shm-usage',
                '--lang=en-US,en'
              ]
            });

            const context = await browser.newContext({
              viewport: { width: 1920, height: 1080 },
              userAgent: 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36',
              locale: 'en-US',
              timezoneId: 'Africa/Lagos',
              permissions: ['geolocation'],
              colorScheme: 'light',
              deviceScaleFactor: 1,
              hasTouch: false,
              isMobile: false
            });

            await context.addInitScript(() => {
              Object.defineProperty(navigator, 'webdriver', { get: () => undefined });
              window.chrome = { runtime: {} };
            });

            const page = await context.newPage();

            console.log('Navigating to emulator...');
            const response = await page.goto('https://android.aivideo.blitz.cloud/', {
              waitUntil: 'networkidle',
              timeout: 45000
            });

            const status = response ? response.status() : 0;
            const body = await page.content();
            const isAsleep = body.includes('"status":"asleep"') || body.includes('This app is asleep');

            console.log('HTTP status:', status);
            console.log('Appears asleep:', isAsleep);

            // Human-like behaviour
            await page.mouse.move(400, 300);
            await page.waitForTimeout(1200 + Math.random() * 800);
            await page.mouse.move(800, 500, { steps: 12 });
            await page.waitForTimeout(800);
            await page.evaluate(() => window.scrollBy(0, 200));
            await page.waitForTimeout(1500);

            const finalBody = await page.content();
            const stillAsleep = finalBody.includes('"status":"asleep"');

            if (stillAsleep) {
              console.log('❌ Still asleep after stealth visit');
              process.exitCode = 1;
            } else {
              console.log('✅ Appears awake (or at least not returning asleep JSON)');
            }

            await browser.close();
          })().catch(err => {
            console.error(err);
            process.exit(1);
          });
          EOF

      - name: Summary
        if: always()
        run: |
          echo "Keep-alive attempt finished."
          echo "Check the logs above for success/failure."
