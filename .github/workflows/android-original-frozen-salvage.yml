name: Verify all original frozen whole-volume bytes before rescue publication
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android-original-guest-rescue
  cancel-in-progress: false
jobs:
  verify-original-frozen-epoch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FORENSIC_CANDIDATE: 'true'
      GITHUB_REPOSITORY: ${{ github.repository }}
      GH_PAT: ${{ secrets.GH_PAT || github.token }}
      EMULATOR_STATE_KEY: ${{ secrets.EMULATOR_STATE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests cryptography
      - name: Verify exact original frozen epoch without touching live source
        run: python -u android-emulator/verify_original_frozen_salvage.py
