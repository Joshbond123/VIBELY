name: Android Live Phone — deployment and session rotation

on:
  schedule:
    # Automatic 4-hour rotation & watchdog recovery schedule
    - cron: '0 */4 * * *'
  workflow_dispatch:
    inputs:
      gateway_only:
        description: 'Deploy gateway UI/transport without replacing the current Android OS session'
        type: boolean
        default: false
      rotation_minutes:
        description: 'Minutes to keep this emulator active before dispatching successor (default: 240 = 4 hours)'
        required: false
        default: '240'
        type: string
      rapid_test_cycles:
        description: 'Remaining rapid rotation verification cycles before settling into 240m mode'
        required: false
        default: '0'
        type: string
      force_rotate:
        description: 'Boot replacement even if an active emulator rotated recently'
        required: false
        default: 'true'
        type: string
      simulate_boot_failure:
        description: 'Simulate candidate initialization failure to test zero-impact active preservation'
        required: false
        default: 'false'
        type: string
      force_gateway_redeploy:
        description: 'Force rebuild/redeploy of the android.aivideo.blitz.cloud gateway'
        required: false
        default: 'false'
        type: string
      simulate_emulator_crash:
        description: 'Seconds after promotion to deliberately kill the emulator (proves self-heal). 0 = off'
        required: false
        default: '0'
        type: string
      install_test_package:
        description: 'Play Store package to install for a real in-session install test (blank = skip)'
        required: false
        default: ''
        type: string

permissions:
  contents: write
  actions: write
  packages: write

jobs:
  ensure-gateway:
    name: Ensure android.aivideo.blitz.cloud Remote Gateway
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      gateway_url: ${{ steps.prov.outputs.gateway_url }}
      blitz_app_id: ${{ steps.prov.outputs.blitz_app_id }}
      should_boot: ${{ steps.coord.outputs.should_boot }}
    env:
      BLITZ_API_KEY: ${{ secrets.BLITZ_API_KEY }}
      EMULATOR_ACCESS_TOKEN: ${{ secrets.EMULATOR_ACCESS_TOKEN }}
      EMULATOR_GATEWAY_SECRET: ${{ secrets.EMULATOR_GATEWAY_SECRET }}
      FORCE_GATEWAY_REDEPLOY: ${{ inputs.force_gateway_redeploy || 'false' }}

    steps:
      - name: Checkout VIBELY repository
        uses: actions/checkout@v4

      - name: Check if android.aivideo.blitz.cloud gateway is already online
        id: quickcheck
        run: |
          GW_URL="${{ secrets.EMULATOR_GATEWAY_URL }}"
          ONLINE="false"
          if [[ "${FORCE_GATEWAY_REDEPLOY}" != "true" && -n "$GW_URL" ]]; then
            SVC=$(curl -fsSL --max-time 10 "${GW_URL}/api/public/health" 2>/dev/null | jq -r '.service // empty' || echo "")
            if [[ "$SVC" == "vibely-android-remote-gateway" ]]; then
              ONLINE="true"
            fi
          fi
          echo "already_online=$ONLINE" >> "$GITHUB_OUTPUT"

      - name: Build & Push Gateway Container to GHCR (initial deploy / update)
        if: steps.quickcheck.outputs.already_online != 'true'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          IMG="ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/vibely-android-gateway:latest"
          docker build -t "$IMG" ./android-remote-gateway
          docker push "$IMG"

      - name: Provision / Verify android.aivideo.blitz.cloud Remote Gateway
        id: prov
        run: |
          node ./android-emulator/deploy-gateway.mjs

      - name: Coordinate rotation necessity (prevent duplicate cron overlap)
        id: coord
        run: |
          GW_URL="${{ steps.prov.outputs.gateway_url }}"
          FORCE="${{ inputs.force_rotate || 'false' }}"
          EVENT="${{ github.event_name }}"
          SHOULD_BOOT="true"

          if [[ "$EVENT" == "schedule" && "$FORCE" != "true" && -n "$GW_URL" ]]; then
            HEALTH=$(curl -fsSL --max-time 15 "${GW_URL}/api/public/health" 2>/dev/null || echo "")
            if [[ -n "$HEALTH" ]]; then
              CONNECTED=$(echo "$HEALTH" | jq -r '.active_emulator_connected // false')
              UPTIME=$(echo "$HEALTH" | jq -r '.active_uptime_sec // 0')
              STANDBY=$(echo "$HEALTH" | jq -r '.standby_count // 0')
              echo "Gateway health: connected=$CONNECTED uptime=${UPTIME}s standby=$STANDBY"
              if [[ "$CONNECTED" == "true" && "$UPTIME" -lt 12600 ]] || [[ "$STANDBY" -gt 0 ]]; then
                echo "Healthy active emulator is within 4h window (${UPTIME}s < 12600s); skipping redundant cron launch."
                SHOULD_BOOT="false"
              fi
            fi
          fi
          echo "should_boot=$SHOULD_BOOT" >> "$GITHUB_OUTPUT"

  android-emulator:
    name: ReactiveCircus Android 14 (Pixel 6 · KVM)
    needs: ensure-gateway
    # Re-enabled when gateway reports no active emulator (black-screen fix 2026-11-02).
    # still respects should_boot coordination so a healthy live session is not replaced.
    # Signed-in state risk remains: prefer recovered-live / whole-AVD path when available.
    if: ${{ needs.ensure-gateway.outputs.should_boot == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      EMULATOR_GATEWAY_URL: ${{ needs.ensure-gateway.outputs.gateway_url || secrets.EMULATOR_GATEWAY_URL }}
      EMULATOR_GATEWAY_SECRET: ${{ secrets.EMULATOR_GATEWAY_SECRET }}
      EMULATOR_ACCESS_TOKEN: ${{ secrets.EMULATOR_ACCESS_TOKEN }}
      EMULATOR_STATE_KEY: ${{ secrets.EMULATOR_STATE_KEY }}
      BLITZ_API_KEY: ${{ secrets.BLITZ_API_KEY }}
      BLITZ_ANDROID_APP: ${{ needs.ensure-gateway.outputs.blitz_app_id || secrets.BLITZ_ANDROID_APP }}
      GH_PAT: ${{ secrets.GH_PAT }}
      ROTATION_MINUTES: ${{ inputs.rotation_minutes || '240' }}
      RAPID_TEST_CYCLES: ${{ inputs.rapid_test_cycles || '0' }}
      SIMULATE_BOOT_FAILURE: ${{ inputs.simulate_boot_failure || 'false' }}
      VIBELY_INSTALL_TEST_PACKAGE: ${{ inputs.install_test_package || '' }}
      # The agent relaunches this AVD from its own disk when the emulator process dies.
      VIBELY_AVD_NAME: vibely_pixel6_api34
      VIBELY_SIMULATE_CRASH_AFTER_SEC: ${{ inputs.simulate_emulator_crash || '0' }}
      ANDROID_CHECKPOINT_IMAGE_FAMILY: google_apis_playstore
      ANDROID_STATE_BRANCH: android-state-v1
      # Whole-AVD is the sole authoritative persistence path (userdata + accounts).
      GITHUB_AVD_ONLY: 'true'
      AVD_DIR: /home/runner/.android/avd/vibely_pixel6_api34.avd

    steps:
      - name: Checkout VIBELY repository
        uses: actions/checkout@v4

      - name: Enable Linux KVM hardware virtualization
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo chmod 666 /dev/kvm || true
          ls -la /dev/kvm

      - name: Ensure sufficient runner SSD headroom
        run: |
          FREE_GB=$(df -BG / | awk 'NR==2 {gsub("G","",$4); print $4}')
          echo "Runner free root disk: ${FREE_GB}GB"
          if [[ "$FREE_GB" -lt 18 ]]; then
            echo "Reclaiming unused SDK bloat (/usr/share/dotnet, /opt/ghc)..."
            sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost || true
            df -h /
          fi

      - name: Cache Android 14 Play Store system image
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/lib/android/sdk/system-images/android-34/google_apis_playstore/x86_64
          key: android-sysimg-34-google_apis_playstore-x86_64-v1

      - name: Install Python crypto deps for whole-AVD persistence
        run: |
          python3 -m pip install --quiet requests cryptography
          sudo apt-get update -qq && sudo apt-get install -y -qq zstd jq

      - name: Prepare emulator agent & lifecycle scripts
        run: |
          chmod +x ./android-emulator/pre-launch.sh ./android-emulator/state-manager.sh ./android-emulator/run-session.sh
          chmod +x ./android-emulator/restore-whole-avd.sh ./android-emulator/save-whole-avd.sh ./android-emulator/device-realism.sh ./android-emulator/hide-root-emulator.sh ./android-emulator/real-phone.sh ./android-emulator/root-live.py
          cd ./android-emulator && npm install --no-audit --no-fund

      - name: Restore encrypted whole-AVD from GitHub (if any)
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          EMULATOR_STATE_KEY: ${{ secrets.EMULATOR_STATE_KEY }}
          ANDROID_CHECKPOINT_IMAGE_FAMILY: google_apis_playstore
          ANDROID_STATE_BRANCH: android-state-v1
          AVD_NAME: vibely_pixel6_api34
        run: ./android-emulator/restore-whole-avd.sh

      - name: Decide whether AVD must be force-created
        id: avd
        run: |
          AVD="$HOME/.android/avd/vibely_pixel6_api34.avd"
          if [[ -d "$AVD" ]] && ls "$AVD"/userdata* >/dev/null 2>&1; then
            echo "force=false" >> "$GITHUB_OUTPUT"
            echo "Restored/existing AVD detected; will not force-create"
          else
            echo "force=true" >> "$GITHUB_OUTPUT"
            echo "No userdata AVD; first-boot create with Play Store image"
          fi

      - name: Boot Android 14 Play Store phone & run coordinated session
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis_playstore
          arch: x86_64
          profile: pixel_6
          cores: 4
          ram-size: 6144M
          heap-size: 512M
          disk-size: 12288M
          sdcard-path-or-size: 2048M
          avd-name: vibely_pixel6_api34
          force-avd-creation: ${{ steps.avd.outputs.force }}
          emulator-boot-timeout: 480
          disable-animations: true
          enable-hw-keyboard: true
          # -no-snapshot-load/-save: the phone must always cold-boot from the
          # persisted, crash-consistent data disk. Loading a RAM snapshot taken
          # mid-install is what made Play Store installs stick forever again after
          # every rotation.
          # NOTE: -prop is NOT used. On current emulators it only accepts qemu.*
          #   ("unexpected -prop value ..., only 'qemu.*' properties are supported"),
          #   and a Play (production) image has no adb root, so ro.* / pm.dexopt.*
          #   cannot be set at all - both verified on the live device. Hardware and
          #   timeout tuning is done where it actually takes effect:
          #   pre-launch.sh (config.ini, after the whole-AVD restore) and
          #   device-realism.sh (settings/appops/deviceidle).
          emulator-options: -ramdisk /tmp/vibely-ramdisk.img -no-window -no-snapshot-load -no-snapshot-save -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back emulated -camera-front emulated -dns-server 8.8.8.8,1.1.1.1 -netdelay none -netspeed full
          pre-emulator-launch-script: ./android-emulator/pre-launch.sh
          script: ./android-emulator/run-session.sh 2>&1 | tee -a /tmp/vibely-agent.log

      - name: Publish emulator self-heal log
        if: always()
        run: |
          sudo -n dmesg 2>/dev/null | tail -200 > /tmp/host-dmesg.log || true
          free -m > /tmp/host-memory.log || true

      - name: Publish session diagnostics artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-session-diagnostics-${{ github.run_id }}
          path: |
            /tmp/vibely_install_test.json
            /tmp/vibely-agent.log
            /tmp/vibely-emulator.log
            /tmp/host-dmesg.log
            /tmp/host-memory.log
          if-no-files-found: warn
          retention-days: 14

      - name: Automatic Failure Notification & Cold-Start Self-Healing
        if: failure() && inputs.simulate_boot_failure != 'true'
        run: |
          echo "Emulator workflow encountered a failure; notifying gateway while preserving any active session..."
          if [[ -n "${EMULATOR_GATEWAY_URL:-}" && -n "${EMULATOR_GATEWAY_SECRET:-}" ]]; then
            curl -fsSL --max-time 15 -X POST \
              -H "Authorization: Bearer ${EMULATOR_GATEWAY_SECRET}" \
              -H "Content-Type: application/json" \
              -d "{\"session_id\":\"run_${GITHUB_RUN_ID}\",\"github_run_id\":\"${GITHUB_RUN_ID}\",\"reason\":\"Workflow step failure prior to retirement\"}" \
              "${EMULATOR_GATEWAY_URL}/api/internal/report-failed-candidate" || true

            HEALTH=$(curl -fsSL --max-time 15 "${EMULATOR_GATEWAY_URL}/api/public/health" 2>/dev/null || echo "")
            CONNECTED=$(echo "$HEALTH" | jq -r '.active_emulator_connected // false')
            if [[ "$CONNECTED" != "true" && -n "${GH_PAT:-}" && "${GITHUB_RUN_ATTEMPT}" == "1" ]]; then
              echo "No active emulator currently online; scheduling automatic recovery run in 15s..."
              sleep 15
              curl -fsSL -X POST \
                -H "Authorization: Bearer ${GH_PAT}" \
                -H "Accept: application/vnd.github+json" \
                -H "Content-Type: application/json" \
                -d '{"ref":"main","inputs":{"rotation_minutes":"240","rapid_test_cycles":"0","force_rotate":"true","simulate_boot_failure":"false"}}' \
                "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/android-emulator.yml/dispatches" || true
            fi
          fi
