name: Whole Android disk — encrypted GitHub restore validation
on:
  workflow_dispatch:
permissions:
  contents: write
# Never cancel or serialize the running public phone. This is isolated validation.
concurrency:
  group: android-state-validation-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  disk-roundtrip:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      GITHUB_REPOSITORY: ${{ github.repository }}
      GH_PAT: ${{ secrets.GH_PAT }}
      EMULATOR_STATE_KEY: ${{ secrets.EMULATOR_STATE_KEY }}
      ANDROID_STATE_BRANCH: android-state-validation-${{ github.run_id }}
      AVD_NAME: vibely_disk_validation
      ANDROID_AVD_HOME: /home/runner/.android/avd
      AVD_DIR: /home/runner/.android/avd/vibely_disk_validation.avd
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reserve disk headroom for complete disks, RAM and encrypted restore
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
          df -h /
          FREE_GB=$(df -BG / | awk 'NR==2 {gsub("G","",$4); print $4}')
          test "$FREE_GB" -ge 20
      - name: Install checkpoint tooling
        run: |
          python -m pip install requests cryptography pillow
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          sudo apt-get update -qq
          sudo apt-get install -y -qq zstd
          sudo chmod 666 /dev/kvm
          test -r /dev/kvm -a -w /dev/kvm
      - name: Install genuine Google Play image, create isolated AVD
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager 'platform-tools' 'emulator' 'system-images;android-34;google_apis_playstore;x86_64'
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | avdmanager create avd -n "$AVD_NAME" --path "$AVD_DIR" -k 'system-images;android-34;google_apis_playstore;x86_64' --device pixel_6
          echo 'hw.keyboard=yes' >> "$AVD_DIR/config.ini"
          echo 'disk.dataPartition.size=6144M' >> "$AVD_DIR/config.ini"
      - name: Boot actual Android, prepare persistent marker
        run: |
          nohup emulator -avd "$AVD_NAME" -no-window -gpu swiftshader_indirect -no-audio -no-boot-anim -no-snapshot-load -no-snapshot-save -memory 3072 > /tmp/validation-emulator.log 2>&1 &
          echo $! > /tmp/validation-emulator.pid
          timeout 420 bash -c 'until adb shell getprop sys.boot_completed 2>/dev/null | grep -q 1; do sleep 4; done'
          adb shell input keyevent 224
          adb shell wm dismiss-keyguard
          adb shell settings put system screen_off_timeout 900000
          adb shell svc power stayon false
          adb shell 'mkdir -p /sdcard/Download; echo "whole-disk-validation-rewritten-content" > /sdcard/Download/vibely-persistence-test.txt'
          adb shell am start -a android.settings.SETTINGS
          adb shell pm path com.android.vending | grep -v LicenseChecker
          adb shell pm path com.google.android.gms
          adb shell pm path com.google.android.gsf
      - name: Quiesce VM, capture complete disks and RAM
        run: |
          python android-emulator/avd_checkpoint.py capture --avd "$AVD_DIR" --archive /tmp/whole-avd.tar.zst
      - name: Encrypt, upload to GitHub, verify authenticated download
        run: |
          python android-emulator/validation_roundtrip.py publish /tmp/whole-avd.tar.zst
      - name: Complete shutdown and restore verified whole phone
        run: |
          adb emu kill
          timeout 90 bash -c 'while kill -0 "$(cat /tmp/validation-emulator.pid)" 2>/dev/null; do sleep 2; done'
          mv "$AVD_DIR" "$AVD_DIR.original"
          python android-emulator/avd_checkpoint.py extract --avd "$AVD_DIR" --archive /tmp/restored-avd.tar.zst
          nohup emulator -avd "$AVD_NAME" -no-window -gpu swiftshader_indirect -no-audio -no-boot-anim -snapshot vibely-checkpoint -no-snapshot-save -memory 3072 > /tmp/validation-restored-emulator.log 2>&1 &
          timeout 420 bash -c 'until adb shell getprop sys.boot_completed 2>/dev/null | grep -q 1; do sleep 4; done'
          python android-emulator/avd_checkpoint.py verify --manifest /tmp/whole-avd.tar.zst.json
          adb shell cat /sdcard/Download/vibely-persistence-test.txt | grep -x whole-disk-validation-rewritten-content
          test "$(adb shell settings get system screen_off_timeout | tr -d '\r')" = 900000
          echo 'PASS: actual full shutdown, encrypted GitHub disk roundtrip, and file/settings restoration.'
          echo 'NOT TESTED: authenticated Google/TikTok, Notes UI, cross-runner transfer, or public handover.'
      - name: Failure diagnostics (no account dumps or userdata)
        if: failure()
        run: |
          echo 'Failure preserved original public phone and prior checkpoint.'
          tail -60 /tmp/validation-emulator.log 2>/dev/null || true
          tail -60 /tmp/validation-restored-emulator.log 2>/dev/null || true
      - name: Stop isolated validation emulator
        if: always()
        run: adb emu kill || true
