name: Android Root + Disguise Experiment (isolated)

# Isolated experiment: it creates its OWN AVD on its OWN runner and never touches
# the production session / android-state-v1, so the live phone keeps working
# while we prove out root-on-a-production-image, the real-device identity, and
# root hiding. Nothing is merged into the main workflow until this passes.

on:
  workflow_dispatch:
    inputs:
      reason:
        description: Why this experiment is being run
        required: false
        default: root + disguise proof

concurrency:
  group: android-root-experiment
  cancel-in-progress: false

jobs:
  root-experiment:
    name: Root the Play image, disguise it, verify
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # android-actions/setup-android@v3 crashes on the Node 24 runners
      # (ExecState._setResult), so use the SDK that ships with ubuntu-latest and
      # fall back to fetching cmdline-tools if it is missing.
      - name: Locate or install Android SDK
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          if [ ! -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            echo "cmdline-tools missing at $SDK — downloading"
            mkdir -p "$SDK/cmdline-tools"
            curl -sSL -o /tmp/clt.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q -o /tmp/clt.zip -d /tmp/clt
            mv /tmp/clt/cmdline-tools "$SDK/cmdline-tools/latest"
          fi
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK/emulator" >> "$GITHUB_PATH"
          ls "$SDK/cmdline-tools/latest/bin/sdkmanager"

      - name: Accept licences + install tools
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install "platform-tools" "emulator" >/dev/null
          sdkmanager --list_installed | head -20

      - name: Run root + disguise experiment
        run: |
          set -o pipefail
          python3 android-emulator/root_experiment.py 2>&1 | tee /tmp/root-experiment.log
          echo "exit=${PIPESTATUS[0]}"

      - name: Collect evidence
        if: always()
        run: |
          mkdir -p artifacts
          cp /tmp/root-experiment.log artifacts/ 2>/dev/null || true
          cp /tmp/rootexp/rootavd.log artifacts/ 2>/dev/null || true
          cp /tmp/rootexp/emulator.log artifacts/ 2>/dev/null || true
          adb -s emulator-5554 shell getprop > artifacts/getprop.txt 2>/dev/null || true
          adb -s emulator-5554 shell pm list packages > artifacts/packages.txt 2>/dev/null || true
          adb -s emulator-5554 exec-out screencap -p > artifacts/screen.png 2>/dev/null || true
          ls -la artifacts

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: root-disguise-evidence-${{ github.run_id }}
          path: artifacts/
          retention-days: 14
